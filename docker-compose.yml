# SmartSociety 360 - Root Architecture Setup
version: '3.8'

services:
  # Primary Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ss360
      POSTGRES_PASSWORD: ss360_password
      POSTGRES_DB: smartsociety360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ss360-network

  # Cache & Queues
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ss360-network

  # Local IoT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001" # WebSockets
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ss360-network

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:

networks:
  ss360-network:
    driver: bridge
